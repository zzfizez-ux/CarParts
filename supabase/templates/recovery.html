<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarParts · Passwort zurücksetzen</title>
</head>
<body style="margin:0;background:#f2f4f6;color:#141c23;font-family:Arial,sans-serif">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f4f6">
    <tr><td align="center" style="padding:24px 12px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:14px">
        <tr><td style="padding:26px 24px;background:#121920;border-radius:14px 14px 0 0">
          <span style="font-size:22px;font-weight:bold;color:#ffffff">Car<span style="color:#ff8c79">Parts</span></span>
        </td></tr>
        <tr><td style="padding:28px 24px;font-size:16px;line-height:1.55">
          <h1 style="margin:0 0 14px;font-size:23px;line-height:1.3">Passwort zurücksetzen</h1>
          <p style="margin:0 0 16px">Du hast ein neues Passwort für dein CarParts-Konto angefordert. Gib diesen Einmalcode zusammen mit deiner E-Mail-Adresse auf CarParts ein.</p>
          <p style="margin:0 0 20px;padding:12px 16px;background:#eef2f5;color:#141c23;border-radius:8px;font:700 26px/1.4 monospace;letter-spacing:4px">{{ .Token }}</p>
          <p style="margin:0 0 20px"><a href="{{ .SiteURL }}?account=recovery" style="display:inline-block;padding:12px 17px;background:#121920;color:#ffffff;border-radius:8px;text-decoration:none;font-weight:bold">Code auf CarParts eingeben</a></p>
          <p style="margin:0;font-size:14px;color:#505b65">Falls du die Anfrage nicht gestellt hast, kannst du diese Nachricht ignorieren.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
